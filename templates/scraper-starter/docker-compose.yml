services:
  scraper:
    build: .
    image: scraper-starter:latest
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./urls.txt:/app/urls.txt:ro
    command: ["crawl", "--urls-file", "/app/urls.txt", "--out", "/app/data/result.parquet"]
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 3
