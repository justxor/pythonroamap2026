image:
  repository: ghcr.io/me/docker-starter-app
  tag: "0.1.0"
  pullPolicy: IfNotPresent

replicaCount: 3

env:
  APP_ENV: production
  LOG_LEVEL: INFO

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

service:
  type: ClusterIP
  port: 80

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

probes:
  startup:
    failureThreshold: 30
    periodSeconds: 2
  liveness:
    initialDelaySeconds: 10
    periodSeconds: 10
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 5

terminationGracePeriodSeconds: 30

nodeSelector: {}
tolerations: []
affinity: {}
